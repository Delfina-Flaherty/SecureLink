# SecureLink - Sistema de Detección de Fraude
# Cómo usarlo:
#   1. Poné tus CSVs en la carpeta ./data/
#   2. docker compose up -d --build
#   3. Airflow: http://localhost:8080  (user: admin / pass: admin)
#   4. Streamlit dashboard: http://localhost:8501

services:

  # =========== POSTGRES - METADATA DE AIRFLOW ===========
  postgres-airflow:
    image: postgres:15-alpine
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - securelink-network

  # =========== POSTGRES - DATA WAREHOUSE (donde guarda los resultados) ===========
  postgres-dwh:
    image: postgres:15-alpine
    container_name: postgres-dwh
    environment:
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh123
      POSTGRES_DB: securelink
    # Tuning para acelerar el bulk load y las queries del dashboard. Los valores
    # por defecto de Postgres son muy conservadores (shared_buffers=128MB).
    # Estos están dimensionados para una máquina de ~8GB; si tu Docker tiene
    # menos RAM asignada, bajá shared_buffers a 256MB.
    #   shared_buffers=1GB        cache de páginas en RAM (default 128MB)
    #   work_mem=64MB             memoria por operación de sort/hash (queries del dashboard)
    #   maintenance_work_mem=256MB  acelera CREATE INDEX en load_to_dwh
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=256MB"
    volumes:
      - postgres_dwh_data:/var/lib/postgresql/data
      - ./init_sql/init_dwh.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwh -d securelink"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - securelink-network

  # =========== AIRFLOW - INIT (crea la base y el usuario admin) ===========
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-init
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@securelink.com || true
      "
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - AIRFLOW__CORE__FERNET_KEY=
      - AIRFLOW__WEBSERVER__SECRET_KEY=securelink-secret-key-2024
    depends_on:
      postgres-airflow:
        condition: service_healthy
    networks:
      - securelink-network

  # =========== AIRFLOW - SCHEDULER (el que ejecuta los DAGs) ===========
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-scheduler
    command: airflow scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - AIRFLOW__CORE__FERNET_KEY=
      - AIRFLOW__WEBSERVER__SECRET_KEY=securelink-secret-key-2024
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=False
      - AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL=30
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      # Conexión al DWH (donde guardan los resultados del pipeline)
      - AIRFLOW_CONN_POSTGRES_DWH=postgres://dwh:dwh123@postgres-dwh:5432/securelink
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data        # <- acá van tus CSVs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
      postgres-dwh:
        condition: service_healthy
    networks:
      - securelink-network

  # =========== AIRFLOW - WEBSERVER (la UI en el navegador) ===========
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-webserver
    command: airflow webserver
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - AIRFLOW__CORE__FERNET_KEY=
      - AIRFLOW__WEBSERVER__SECRET_KEY=securelink-secret-key-2024
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=False
      - AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL=30
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - AIRFLOW_CONN_POSTGRES_DWH=postgres://dwh:dwh123@postgres-dwh:5432/securelink
      - AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT=300
      - AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT=300
      - AIRFLOW__WEBSERVER__WORKERS=1
      - AIRFLOW__WEBSERVER__WORKER_CLASS=gevent
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-scheduler:
        condition: service_started
      postgres-airflow:
        condition: service_healthy
    networks:
      - securelink-network

  # =========== STREAMLIT - DASHBOARD ===========
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: securelink-dashboard
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=postgres-dwh
      - DB_PORT=5432
      - DB_NAME=securelink
      - DB_USER=dwh
      - DB_PASSWORD=dwh123
    volumes:
      - ./dashboard:/app/dashboard
    depends_on:
      postgres-dwh:
        condition: service_healthy
    networks:
      - securelink-network

networks:
  securelink-network:
    driver: bridge

volumes:
  postgres_airflow_data:
  postgres_dwh_data:
